name: Build and Release Windows App (.exe)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Versão do Release (ex: v1.0.0)"
        required: false
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: |
          npm install
          npm install --save-dev electron electron-builder

      - name: Build Web App
        run: npm run build

      - name: Build Windows Executable (.exe)
        run: npx electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BearCatchDownloader-Windows-Exe
          path: dist-electron/*.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || inputs.release_tag }}
          name: "Bear Catch Downloader ${{ github.ref_name || inputs.release_tag }}"
          body: |
            ## Bear Catch Downloader 🐻⚡
            
            Versão para Windows (.exe) pronta para baixar e usar!
            
            ### Novidades:
            - Suporte a Playlists completas do YouTube em arquivo compactado ZIP.
            - Escolha inteligente: baixe somente a música ou a playlist inteira.
            - Metadados ID3 e capa em altíssima resolução.
            - Conversão para MP3 (até 320kbps) e MP4 Full HD.
          draft: false
          prerelease: false
          files: dist-electron/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
